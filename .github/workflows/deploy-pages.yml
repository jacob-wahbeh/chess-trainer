# Builds the web app and publishes it to GitHub Pages (https://<owner>.github.io/<repo>/) on every push to
# main. One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          # Pages serves the site from /<repo>, so every link and asset is prefixed with it.
          BASE_PATH: /${{ github.event.repository.name }}
      # Pages answers unknown paths (/chess-trainer/drill) with 404.html: make that the app shell too.
      - run: cp build/index.html build/404.html && touch build/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
